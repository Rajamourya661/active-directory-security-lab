title: Password Spraying - Multiple Account Failures from Single Source
id: ad-lab-spray-001
status: experimental
description: Detects password spraying pattern - many distinct accounts with logon failure 4625 from one source IP in a short window.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: AD Security Lab
date: 2026-06-05
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - Misconfigured applications using wrong service account
  - Typo-prone shared kiosks
level: medium
